name: Release

on:
  push:
    branches:
      - main

jobs:
  # SEC-001: Block the release if no completed audit report has been published
  # in this repository. The report must exist as a file matching the pattern
  # docs/audit-report-*.{pdf,md} before a release tag can be created.
  # To bypass during development/pre-mainnet, remove this job or add a
  # docs/audit-report-*.md placeholder — but never deploy to mainnet without
  # a real external audit report.
  audit-gate:
    name: Security Audit Gate (SEC-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify audit report exists
        run: |
          REPORTS=$(find docs -maxdepth 1 -name "audit-report-*" \( -name "*.pdf" -o -name "*.md" \) 2>/dev/null | grep -v "^$" | head -5)
          if [ -z "$REPORTS" ]; then
            echo "::error::SEC-001 deployment gate: No audit report found under docs/."
            echo "::error::A completed security audit report (docs/audit-report-<version>-<auditor>.pdf or .md)"
            echo "::error::must be committed to this repository before a release can be created."
            echo "::error::See docs/security-audit.md for the full audit process and requirements."
            exit 1
          fi
          echo "Audit report(s) found:"
          echo "$REPORTS"

  check-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' contracts/payment-processing-contract/Cargo.toml \
            | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create GitHub Release
    needs: [audit-gate, check-version]
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          # Extract the section between ## [VERSION] and the next ## heading
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Write to a file to preserve newlines
          echo "$NOTES" > release_notes.md

      - name: Create tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file release_notes.md
